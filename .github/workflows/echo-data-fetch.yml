name: echo-data-fetch

# Fetches all Echo newsletter numeric data (Yahoo Finance + official NSE)
# on a GitHub runner — which has unrestricted internet — and commits the
# compact JSON results back to the branch. One-click via the Actions tab
# ("Run workflow"), or triggered by the agent via the GitHub API.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (default today; week ends on the Friday on/before it)"
        required: false
        default: ""
      mode:
        description: "auto (clock decides), full (force NSE fetch), or flash"
        required: false
        default: "auto"
  schedule:
    # 10:05 UTC = 15:35 IST Friday: FLASH run minutes after market close.
    # Only Yahoo-based data exists at this hour (index closes are final;
    # commodities/forex are live snapshots). NSE steps self-skip.
    - cron: "5 10 * * 5"
    # 02:30 UTC Saturday = 08:00 IST: SETTLE run - final overnight closes
    # for commodities and forex (global markets settle after midnight IST).
    - cron: "30 2 * * 6"
    # 13:15 UTC = 18:45 IST Mon-Fri: FULL run. Market closes 15:30 IST
    # but NSE publishes delivery volumes and FII/DII figures
    # ~18:30-19:30 IST; the Friday draft session re-triggers this
    # workflow if the data turns out stale (latest_session check).
    - cron: "15 13 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests xlrd

      - name: Cache NSE bhavcopies (6 months of dailies)
        uses: actions/cache@v4
        with:
          path: data/cache/bhavcopies
          key: bhavcopies-${{ inputs.date || github.run_id }}
          restore-keys: bhavcopies-

      - name: Fetch market data (Yahoo Finance)
        continue-on-error: true
        run: |
          DATE="${{ inputs.date }}"
          python3 scripts/fetch_market_data.py ${DATE:+--date "$DATE"}

      - name: Flash data (live quotes + cached history, market-close runs)
        continue-on-error: true
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          # Auto-flash only on trading-day mornings (UTC), never Saturday's
          # settle run.
          if [ "$MODE" = "auto" ] && [ "$(date -u +%H)" -lt 12 ] && [ "$(date -u +%u)" -le 5 ]; then MODE=flash; fi
          if [ "$MODE" != "flash" ]; then
            echo "Mode $MODE: skipping flash script."
            exit 0
          fi
          DATE="${{ inputs.date }}"
          python3 scripts/fetch_flash.py ${DATE:+--date "$DATE"}

      - name: Fetch NSE data (bhavcopies, breadth, movers, FII/DII)
        continue-on-error: true
        run: |
          # Flash runs skip NSE: delivery/FII data publishes ~18:30-19:30 IST.
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ] && [ "$(date -u +%H)" -lt 12 ]; then MODE=flash; fi
          if [ "$MODE" = "flash" ]; then
            echo "Flash run: NSE data not yet published - skipping."
            exit 0
          fi
          DATE="${{ inputs.date }}"
          python3 scripts/fetch_nse_data.py ${DATE:+--date "$DATE"}

      - name: Fetch extras (Trendlyne FII/DII pages, macro calendar)
        continue-on-error: true
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ] && [ "$(date -u +%H)" -lt 12 ]; then MODE=flash; fi
          if [ "$MODE" = "flash" ]; then
            echo "Flash run: skipping extras."
            exit 0
          fi
          DATE="${{ inputs.date }}"
          python3 scripts/fetch_extras.py ${DATE:+--date "$DATE"}

      - name: Commit JSON results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/*/market_data.json data/raw/*/nse_data.json data/raw/*/extras.json data/raw/*/flash_data.json data/fii_dii/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data files produced — check the fetch step logs above."
          else
            git commit -m "Data fetch via Actions: ${{ inputs.date || 'today' }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload results as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-data
          path: data/raw/*/*.json
          if-no-files-found: warn
